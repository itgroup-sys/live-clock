<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Reminders</title>
<style>
:root{
--dark:#111d2b;--yellow:#ffc400;--green:#b4d900;--white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--dark)}
.safety-card{width:100%;height:100%;background:var(--dark);border:2px solid var(--green);overflow:hidden}
.header{height:50px;background:var(--yellow);display:flex;align-items:center;padding:0 14px;font-size:28px;font-weight:bold}
.slideshow{position:relative;height:calc(100% - 50px)}
.slide{position:absolute;inset:0;padding:35px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;transform:translateX(30px);transition:.7s}
.slide.active{opacity:1;transform:translateX(0)}
.icon{font-size:82px;margin-bottom:20px}
.title{color:var(--yellow);font-size:44px;font-weight:bold;margin-bottom:20px}
.message{color:#fff;font-size:30px;line-height:1.45;max-width:90%}
.indicators{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#6b7280}
.dot.active{background:var(--yellow);transform:scale(1.5)}
</style>
</head>
<body>
<div class="safety-card">
<div class="header">🛡️ SAFETY REMINDERS / MGA PAALALA SA KALIGTASAN</div>
<div class="slideshow" id="slides"></div>
<div class="indicators" id="dots"></div>
</div>
<script>
const items=[
["🛡️","KALIGTASAN MUNA","Ang inyong kaligtasan ang aming pangunahing prayoridad. Sundin ang lahat ng safety practices habang nagtatrabaho sa warehouse."],
["🦺","MAGSUOT NG PPE","Laging isuot ang kinakailangang Personal Protective Equipment (PPE)."],
["🚶","PANATILIHING MALINIS ANG MGA DAANAN","Panatilihing walang harang ang mga daanan, pasilyo at emergency exits."],
["🔍","SURIIN ANG MGA KAGAMITAN","Suriin muna ang forklift, pallet jack at iba pang kagamitan bago gamitin."],
["📦","AYUSING ISALANSAN ANG MGA MATERYALES","Isalansan nang maayos ang mga materyales upang maiwasan ang pagkahulog."],
["🚨","IULAT ANG MGA PANGANIB","Agad na iulat ang anumang mapanganib na kondisyon, sirang kagamitan o near-miss incident."],
["🏋️","TAMANG PARAAN NG PAGBUBUHAT","Gamitin ang tamang paraan ng pagbubuhat at humingi ng tulong kung kinakailangan."],
["🧹","PANATILIHING MALINIS ANG LUGAR","Panatilihing malinis at maayos ang inyong lugar ng trabaho."],
["⛔","SUMUNOD SA MGA PAMAMARAAN","Huwag laktawan ang safety procedures o gumamit ng kagamitan nang walang pahintulot."],
["🤝","RESPONSIBILIDAD NG LAHAT","Magtulungan tayo upang mapanatiling ligtas, malinis at walang aksidente ang ating lugar ng trabaho."],
["🏠","ISIPIN ANG KALIGTASAN","Isipin ang Kaligtasan. Magtrabaho nang Ligtas. Umuwing Ligtas."]
];
const wrap=document.getElementById("slides"),dots=document.getElementById("dots");
items.forEach((i,n)=>{
 const s=document.createElement("div");
 s.className="slide"+(n===0?" active":"");
 s.innerHTML=`<div class="icon">${i[0]}</div><div class="title">${i[1]}</div><div class="message">${i[2]}</div>`;
 wrap.appendChild(s);
 const d=document.createElement("span");
 d.className="dot"+(n===0?" active":"");
 dots.appendChild(d);
});
const slides=[...document.querySelectorAll(".slide")],ds=[...document.querySelectorAll(".dot")];
let c=0;
setInterval(()=>{
 slides[c].classList.remove("active"); ds[c].classList.remove("active");
 c=(c+1)%slides.length;
 slides[c].classList.add("active"); ds[c].classList.add("active");
},10000);
</script>
</body>
</html>
