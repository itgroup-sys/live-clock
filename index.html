<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* Card */

.clock-card{

    width:100%;
    height:100%;

    background:#111d2b;

    border:2px solid #b4d900;
    border-radius:5px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:18px;
}

/* LIVE */

.live-time{

    display:flex;
    align-items:center;
    gap:8px;

    color:#ffc400;

    font-size:clamp(13px,1.2vw,18px);
    font-weight:bold;

    margin-bottom:14px;

}

/* Live dot */

.live-dot{

    width:10px;
    height:10px;

    background:#35d07f;

    border-radius:50%;

    box-shadow:0 0 8px #35d07f;

}

/* Time */

.time{

    color:#ffffff;

    font-size:clamp(36px,4vw,58px);

    font-weight:700;

    line-height:1.1;

    white-space:nowrap;

}

/* AM PM */

.time span{

    color:#ffc400;

    font-size:0.55em;

}

/* Divider */

.divider{

    width:72%;

    height:1px;

    background:#49596b;

    margin:16px 0;

}

/* Date */

.date-container{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

}

.calendar{

    color:#ffc400;

    font-size:clamp(14px,1.4vw,18px);

}

.date{

    color:#ffffff;

    font-size:clamp(13px,1.4vw,18px);

    font-weight:500;

    white-space:nowrap;

}

</style>

</head>

<body>

<div class="clock-card">

    <div class="live-time">
        <span class="live-dot"></span>
        LIVE TIME
    </div>

    <div class="time" id="clock">
        00:00:00 <span>AM</span>
    </div>

    <div class="divider"></div>

    <div class="date-container">

        <span class="calendar">📅</span>

        <div class="date" id="date">
            Loading...
        </div>

    </div>

</div>

<script>

function updateClock(){

    const now = new Date();

    let hours = now.getHours();

    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12;
    hours = String(hours).padStart(2,"0");

    document.getElementById("clock").innerHTML =
        `${hours}:${minutes}:${seconds} <span>${ampm}</span>`;

    const date = now.toLocaleDateString("en-PH",{

        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"

    });

    document.getElementById("date").textContent = date;

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
