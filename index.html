<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:transparent;
}

/* Card */

.clock-card{

    width:100%;
    height:100%;

    background:#111d2b;

    border:2px solid #b4d900;
    border-radius:5px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

}

/* LIVE */

.live-time{

    display:flex;
    align-items:center;
    gap:8px;

    color:#ffc400;

    font-size:18px;
    font-weight:bold;

    margin-bottom:18px;

}

/* Live Dot */

.live-dot{

    width:10px;
    height:10px;

    background:#2ce46d;

    border-radius:50%;

    box-shadow:0 0 10px #2ce46d;

}

/* Time */

.time{

    color:#ffffff;

    font-size:60px;

    font-weight:700;

    line-height:1;

    white-space:nowrap;

}

/* AM PM */

.time span{

    color:#ffc400;

    font-size:28px;

}

/* Divider */

.divider{

    width:78%;

    height:2px;

    background:#46505b;

    margin:18px 0;

}

/* Date */

.date-container{

    display:flex;
    align-items:flex-start;
    justify-content:center;

    gap:12px;

}

/* Calendar */

.calendar{

    font-size:30px;

}

/* Date */

.date{

    color:#ffffff;

    text-align:left;

    line-height:1.3;

}

.weekday{

    font-size:28px;

    font-weight:700;

}

.full-date{

    font-size:24px;

    color:#d6d6d6;

}

</style>
</head>

<body>

<div class="clock-card">

    <div class="live-time">

        <span class="live-dot"></span>

        LIVE TIME

    </div>

    <div class="time" id="clock">

        00:00:00 <span>AM</span>

    </div>

    <div class="divider"></div>

    <div class="date-container">

        <div class="calendar">📅</div>

        <div class="date">

            <div class="weekday" id="weekday">
                Wednesday
            </div>

            <div class="full-date" id="fulldate">
                July 29, 2026
            </div>

        </div>

    </div>

</div>

<script>

function updateClock(){

    const now = new Date();

    let hours = now.getHours();

    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12;
    hours = String(hours).padStart(2,"0");

    document.getElementById("clock").innerHTML =
        `${hours}:${minutes}:${seconds} <span>${ampm}</span>`;

    document.getElementById("weekday").textContent =
        now.toLocaleDateString("en-PH",{
            weekday:"long"
        });

    document.getElementById("fulldate").textContent =
        now.toLocaleDateString("en-PH",{
            month:"long",
            day:"numeric",
            year:"numeric"
        });

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
